name: vanguard

services:
  vanguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: vanguard:local
    container_name: vanguard-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/pulse.db
      TRANSFORMERS_CACHE: /app/.cache/transformers
      PLAYWRIGHT_CDP_ENDPOINT: ${PLAYWRIGHT_CDP_ENDPOINT:-}
      BROWSER_PROFILE_DIR: /data/browser-profile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VANGUARD_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - vanguard-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: vanguard-tailscale
    hostname: vanguard-cockpit
    restart: unless-stopped
    profiles: ["tailscale"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

volumes:
  vanguard-data:
    driver: local
  tailscale-state:
    driver: local

